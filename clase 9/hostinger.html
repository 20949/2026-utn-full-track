<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./hostinger.css">
    <title>Hostinger</title>
</head>

<body>

    <section class="seccion-idea">
        <h2 class="titulo-principal">
            Expresá tu idea
        </h2>
        <h3 class="subtitulo">El Agente Hostinger se encarga del resto</h3>


        <form action="" class="form-busqueda">
            <input class="input-busqueda" type="text" placeholder="¿Qué te gustaría crear hoy?">
            <button class="btn-enviar">

                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-chevron-right preview-icon">
                    <path d="m9 18 6-6-6-6" />
                </svg>

            </button>
        </form>
        <p class="parrafo-descripcion">Obtenga un plan de sitio e ideas de dominio en menos de un minuto. Gratis, sin
            registro</p>

    </section>

</body>

</html>
