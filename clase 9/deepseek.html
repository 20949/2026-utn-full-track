<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Seek - Fixed</title>
    <link rel="stylesheet" href="./deepseek.css">
</head>

<body>

    <section class="seccion-chat">

        <h2 class="titulo-principal">Hello, i'm DeepSeek</h2>
        <div class="content">
            Contenido / respuesta
        </div>

        <form class="chat-box">

            <textarea class="textarea-chat" name="" rows="4" id=""></textarea>

            <div class="btn-container">
                <button class="btn-profundo">Pensamiento profundo</button>
                <button class="btn-inteligente">Búsqueda inteligente</button>
                <button class="btn-adjuntar"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-paperclip preview-icon">
                        <path
                            d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551" />
                    </svg></button>
                <button class="btn-enviar"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-arrow-up preview-icon">
                        <path d="m5 12 7-7 7 7" />
                        <path d="M12 19V5" />
                    </svg></button>
            </div>
        </form>

    </section>

</body>

</html>
